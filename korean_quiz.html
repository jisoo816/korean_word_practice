<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한글 받아쓰기 · Shuffle Once</title>
  <style>
    :root { --card:#fff; --ink:#0f172a; --muted:#64748b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,sans-serif; color:var(--ink); background:#f5f7fa; }
    .wrap { max-width:960px; margin:0 auto; padding:24px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    header h1 { margin:0; font-size:20px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; }
    button, textarea { font:inherit; }
    button { padding:10px 14px; border-radius:12px; border:1px solid #e5e7eb; background:#fff; cursor:pointer; }
    button.primary { background:#000; color:#fff; }
    button:active { transform: translateY(1px); }
    .card { background:var(--card); border:1px solid #e5e7eb; border-radius:16px; padding:16px; }
    .big { display:flex; align-items:center; justify-content:center; height:40vh; font-weight:800; text-align:center; line-height:1.05; font-size:clamp(56px,12vw,160px); user-select:none; }
    details { margin-top:16px; }
    textarea { width:100%; height:140px; padding:12px; border-radius:12px; border:1px solid #cbd5e1; }
    .grid2 { display:grid; grid-template-columns:1fr 260px; gap:12px; }
    @media (max-width:800px){ .grid2 { grid-template-columns:1fr; } }
    .muted { color:var(--muted); font-size:12px; }
    .pill { border:1px solid #e5e7eb; border-radius:10px; padding:4px 8px; background:#fff; }
    ul.wordlist { display:flex; flex-wrap:wrap; gap:8px; list-style:none; padding:0; margin:16px 0 0; }
    ul.wordlist li { border:1px solid #e5e7eb; border-radius:10px; background:#fff; padding:4px 10px; }
  </style>
  <!-- React (CDN) + Babel (for JSX in single-file) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div id="root"></div>
  </div>

  <script type="text/babel">
    // ---------- Data / Utils ----------
    const STORAGE = 'hangul_shuffle_once_v1';
    const DEFAULT_WORDS = [
      '아기','야구','유자','고기','기차','나무','바다','오리','치즈','포도','바나나','피아노'
    ];
    const PASTELS = ['#F3F4F6','#FFF7ED','#ECFEFF','#FCE7F3','#E0F2FE','#EDE9FE','#F0FDF4','#FEFCE8','#FFE4E6','#F1F5F9'];
    const randItem = (arr) => arr[Math.floor(Math.random()*arr.length)];
    const load = () => { try { return JSON.parse(localStorage.getItem(STORAGE))||null; } catch { return null; } };
    const save = (s) => { try { localStorage.setItem(STORAGE, JSON.stringify(s)); } catch {} };

    function useKoreanTTS() {
      const [voice, setVoice] = React.useState(null);
      React.useEffect(() => {
        const pick = () => {
          const vs = window.speechSynthesis.getVoices();
          const ko = vs.find(v => /ko|Korean/i.test(v.lang));
          setVoice(ko || vs[0] || null);
        };
        pick();
        window.speechSynthesis.onvoiceschanged = pick;
      }, []);
      return (text, rate=0.9) => {
        if (!('speechSynthesis' in window)) return;
        const u = new SpeechSynthesisUtterance(text);
        if (voice) u.voice = voice;
        u.lang = voice?.lang || 'ko-KR';
        u.rate = rate;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      };
    }

    function App(){
      const saved = load();
      const [words, setWords] = React.useState(saved?.words?.length ? saved.words : DEFAULT_WORDS);
      const [shuffledWords, setShuffledWords] = React.useState([]);
      const [idx, setIdx] = React.useState(saved?.idx ?? 0);
      const [bg, setBg] = React.useState(saved?.bg || randItem(PASTELS));
      const speak = useKoreanTTS();
      const listRef = React.useRef(null);

      // Persist minimal state
      React.useEffect(() => { save({ words, idx, bg }); }, [words, idx, bg]);

      // Shuffle once on first load
      React.useEffect(() => {
        shuffleOnce();
        // eslint-disable-next-line
      }, []);

      const word = shuffledWords.length ? shuffledWords[idx % shuffledWords.length] : '단어 없음';

      function shuffleOnce(){
        if (!words.length) { setShuffledWords([]); setIdx(0); return; }
        const arr = [...words];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        setShuffledWords(arr);
        setIdx(0);
        setBg(randItem(PASTELS));
      }

      function next(speakIt=false){
        if (!shuffledWords.length) return;
        const ni = (idx + 1) % shuffledWords.length;
        setIdx(ni);
        setBg(randItem(PASTELS));
        if (speakIt) setTimeout(() => speak(shuffledWords[ni]), 30);
      }

      function prev(){
        if (!shuffledWords.length) return;
        const pi = (idx - 1 + shuffledWords.length) % shuffledWords.length;
        setIdx(pi);
        setBg(randItem(PASTELS));
      }

      // Keyboard: Space=listen, →=next, ←=prev, R=reshuffle, S=speak, F=fullscreen
      React.useEffect(() => {
        const onKey = (e) => {
          if (e.code === 'Space') { e.preventDefault(); speak(word); }
          if (e.key === 'ArrowRight') { e.preventDefault(); next(true); }
          if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
          if (e.key?.toLowerCase() === 'r') { shuffleOnce(); }
          if (e.key?.toLowerCase() === 's') { speak(word); }
          if (e.key?.toLowerCase() === 'f') {
            const el = document.documentElement;
            if (!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [word, shuffledWords.length, idx]);

      function replaceFromTextarea(){
        const ta = document.getElementById('bulk');
        const raw = ta?.value || '';
        const list = raw.split(/[\n,\t]/).map(s => s.trim()).filter(Boolean);
        const uniq = Array.from(new Set(list));
        if (uniq.length) {
          setWords(uniq);
          setTimeout(shuffleOnce, 0); // refresh shuffled order
        }
      }

      function addWord(){
        const v = prompt('추가할 단어(쉼표로 여러 개 가능)');
        if (!v) return;
        const list = v.split(/[, \n\t]/).map(s => s.trim()).filter(Boolean);
        if (!list.length) return;
        const merged = Array.from(new Set([...words, ...list]));
        setWords(merged);
        setTimeout(shuffleOnce, 0);
      }

      function dedup(){
        const uniq = Array.from(new Set(words));
        setWords(uniq);
        setTimeout(shuffleOnce, 0);
      }

      return (
        <>
          <header>
            <h1>한글 낱말 연습 · (Shuffle once)</h1>
            <div className="toolbar">
             
              <button onClick={() => speak(word)}>🔊 듣기 (S)</button>
              <button onClick={() => { const el=document.documentElement; if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.(); }}>⛶ 전체화면 (F)</button>
              <span className="pill">현재: {idx + 1} / {shuffledWords.length || 0}</span>
            </div>
          </header>

          <div className="card" style={{ background:bg + 'aa' }}>
            <div className="muted">단어 카드</div>
            <div className="big">{word}</div>

            <div className="toolbar" style={{ justifyContent:'center' }}>
              <button onClick={prev}>← 이전</button>
              <button className="primary" onClick={() => next(true)}>다음 →</button>
              <button onClick={addWord}>＋ 단어 추가</button>
              <button onClick={shuffleOnce}>🔀 순서 섞기</button>
              <button onClick={dedup}>🧹 중복 제거</button>
            </div>
           
            {/** optional: show current shuffled order as a single compact text block */}
            <div style={{ marginTop: 12 }}>
              <div className="muted" style={{ marginBottom: 6 }}>현재 순서</div>
              <textarea
                ref={listRef}
                readOnly
                rows={1}
                value={shuffledWords.join(', ')}
                onClick={(e) => e.target.select()}
                spellCheck={false}
                style={{
                  width: '100%',
                  height: 30,
                  minHeight: 30,
                  fontSize: '13px',
                  lineHeight: 1.2,
                  borderRadius: 12,
                  border: '1px solid #e5e7eb',
                  padding: '6px 8px',
                  resize: 'vertical',
                  overflow: 'hidden',
                  background: '#fff'
                }}
              />
            </div>
          </div>

          <details>
            <summary>단어 목록 붙여넣기/편집</summary>
            <div className="grid2" style={{ marginTop:12 }}>
              <div>
                <textarea id="bulk" placeholder="쉼표(,) 또는 줄바꿈으로 단어들을 붙여넣으세요">{words.join('\n')}</textarea>
              </div>
              <div>
                <button onClick={replaceFromTextarea}>이 목록으로 교체 + 섞기</button>
                <div className="muted" style={{marginTop:8}}>현재 단어 수: <b>{words.length}</b></div>
                <div className="muted">단축키: Space(듣기), ←/→, R(다시 섞기), S(읽기), F(전체화면)</div>
              </div>
            </div>
          </details>

          <p className="muted" style={{marginTop:16}}>
            팁: 이 파일을 휴대폰 홈화면에 추가하면 앱처럼 사용 가능. 브라우저에서 음성(TTS)을 허용해야 소리가 납니다.
          </p>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
